<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>LinkMeddle</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f5f5f5; }
    header { background: #111; color: white; padding: 10px 20px; }
    header h1 { margin: 0; cursor: pointer; display: inline; }
    .container { padding: 20px; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
    .row { display: flex; gap: 20px; }
    .sidebar { width: 300px; flex-shrink: 0; }
    .main { flex: 1; min-width: 0; }
    .item-row { padding: 8px 0; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-row:hover { background: #fafafa; }
    .item-row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-row.active { font-weight: bold; }
    button { padding: 6px 12px; cursor: pointer; margin-right: 4px; }
    input[type=text] { padding: 6px; width: 300px; }
    textarea { padding: 6px; }
    .muted { color: #777; font-size: 12px; }
    .placeholder { opacity: 0.5; text-align: center; padding: 40px; }
    video { width: 100%; max-height: 500px; background: black; display: block; }
    /* Badges */
    .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 11px; font-weight: bold; }
    .badge-pl   { background: #ddf; color: #336; }
    .badge-ch   { background: #dfd; color: #363; }
    .badge-v    { background: #ffd; color: #663; }
    .badge-ok   { background: #dfd; color: #363; }
    .badge-fail { background: #fdd; color: #633; }
    .badge-run  { background: #ffd; color: #663; }
    /* Rating stars */
    .rating-widget { margin: 8px 0; line-height: 1; }
    .star { cursor: pointer; font-size: 22px; color: #ccc; user-select: none; }
    .star.filled { color: gold; }
    .star.machine { color: #ddd; }
    .grade-label { font-weight: bold; margin-left: 6px; font-size: 16px; }
    .grade-label.machine { color: #999; font-style: italic; }
    /* Grade badges on rows */
    .g { font-size: 11px; font-weight: bold; padding: 1px 4px; border-radius: 2px; }
    .gA { background: #dfd; color: #363; }
    .gB { background: #dff; color: #366; }
    .gC { background: #eee; color: #666; }
    .gD { background: #ffd; color: #663; }
    .gF { background: #fdd; color: #633; }
    /* Failing indicator */
    .failing-badge { color: red; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

<header>
  <h1 onclick="goHome()">LinkMeddle</h1>
</header>

<div id="app" class="container"></div>

<script>
/* === CONFIG === */
const API_BASE = "";

/* === STATE === */
let currentVideoElement = null;
let activePlaylistVideos = [];   // ordered UUIDs of video children in the active container
let activeContainerId = null;    // UUID of the sidebar/autoplay container
let activeContainerData = null;  // ThingPage of the active container
let currentVideoId = null;       // UUID of the currently shown video
let autoPlayEnabled = true;
let helpOverlayVisible = false;
let thingCache = {};             // id → ThingPage
let playbackCache = {};          // id → presigned download_url (or null if no media)

/* === ROUTER === */
window.addEventListener("hashchange", router);
window.addEventListener("load", router);
renderHelpOverlay();

function router() {
  const hash = location.hash || "#/";

  if (hash.startsWith("#/prefill/")) {
    renderHome(decodeURIComponent(hash.replace("#/prefill/", "")));
    return;
  }

  if (hash.startsWith("#/thing/")) {
    const parts = hash.split("/");
    const thingId = parts[2].split("?")[0];
    const params = new URLSearchParams(location.hash.split("?")[1] || "");
    renderThingPage(thingId, params.get("ctx"));
    return;
  }

  // Legacy V3 hash redirects
  if (hash.startsWith("#/playlist/")) {
    location.replace(`#/thing/${hash.split("/")[2]}`);
    return;
  }
  if (hash.startsWith("#/video/")) {
    const parts = hash.split("/");
    const vid = parts[2].split("?")[0];
    const params = new URLSearchParams(location.hash.split("?")[1] || "");
    const pl = params.get("playlist");
    location.replace(pl ? `#/thing/${vid}?ctx=${pl}` : `#/thing/${vid}`);
    return;
  }

  renderHome();
}

function goHome() { location.hash = "#/"; }

/* === API HELPERS === */
async function apiGet(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) {
    const err = new Error(res.statusText);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = new Error(res.statusText);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function apiPatch(path, body) {
  const res = await fetch(API_BASE + path, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = new Error(res.statusText);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function getThingCached(id) {
  if (thingCache[id]) return thingCache[id];
  const t = await apiGet(`/things/${id}`);
  thingCache[id] = t;
  return t;
}

function invalidateCache(id) { delete thingCache[id]; delete playbackCache[id]; }

// Lazily resolve (and cache) a video's presigned playback URL via the BFF, off the page
// view-model — so opening a container does not presign every child's OI URL up front.
async function getPlaybackCached(id) {
  if (id in playbackCache) return playbackCache[id];
  try {
    const p = await apiGet(`/things/${id}/playback`);
    playbackCache[id] = p.download_url ?? null;
  } catch {
    playbackCache[id] = null;
  }
  return playbackCache[id];
}

// Warm the playback cache for the next 1-2 videos after `id` in the active playlist.
function prefetchUpcomingPlayback(id) {
  const idx = activePlaylistVideos.indexOf(id);
  if (idx === -1) return;
  for (const nid of activePlaylistVideos.slice(idx + 1, idx + 3)) {
    getPlaybackCached(nid);   // fire-and-forget
  }
}

/* === RATINGS === */
// thing.grade is computed server-side (lmfe/models.py grade_for) and present on every
// response — read it directly, do not recompute the band thresholds here.

// Map rating float (-2..+2) to filled star count (0..5)
function ratingToFilled(rating) {
  if (rating == null) return 0;
  return Math.round(rating + 3);
}

function renderRatingWidget(thing) {
  // Prefer human_rating for display; fall back to effective_rating (machine)
  const displayRating = thing.human_rating ?? thing.effective_rating ?? null;
  const isMachine = thing.human_rating == null && thing.effective_rating != null;
  const filledCount = ratingToFilled(displayRating);
  const grade = thing.grade;

  const stars = [1, 2, 3, 4, 5].map(n => {
    const filled = n <= filledCount;
    const cls = ["star", filled ? "filled" : "", isMachine ? "machine" : ""].filter(Boolean).join(" ");
    // star n maps to rating n-3 (-2..+2): 1→−2, 2→−1, 3→0, 4→+1, 5→+2
    return `<span class="${cls}" onclick="rateThing('${thing.id}', ${n - 3})">${filled ? "★" : "☆"}</span>`;
  }).join("");

  const gradeCls = `grade-label${isMachine ? " machine" : ""}`;
  const gradeStr = grade ? `<span class="${gradeCls}">${grade}</span>` : "";
  const machineNote = isMachine ? ` <span class="muted">(machine)</span>` : "";
  return `<div class="rating-widget">${stars}${gradeStr}${machineNote}</div>`;
}

async function rateThing(id, rating) {
  let updated;
  try {
    updated = await apiPatch(`/things/${id}`, { human_rating: rating });
  } catch {
    alert("Failed to save rating.");
    return;
  }
  // Use the PATCH response (the updated thing) to refresh cached copies, then
  // re-render ONLY the rating-affected DOM. We deliberately do not call router()
  // or re-render #videoArea: routing takes the in-place path which rebuilds the
  // <video> element and resets playback to 0 (#182). The rated thing is always
  // the one shown in #currentThingInfo, so re-render that card and the sidebar
  // grade badges in place; the playing video is left untouched.
  applyRatingUpdate(id, updated);
  const infoEl = document.getElementById("currentThingInfo");
  if (infoEl) infoEl.innerHTML = renderThingInfoHTML(updated, updated.container === true);
  const sidebar = document.getElementById("playlistSidebar");
  if (sidebar) sidebar.innerHTML = sidebarRowsHTML(currentVideoId);
}

// Patch the rating-derived fields of `id` wherever it is cached (the thing's own
// cached page and any cached container's `related` list, which the in-place
// renderer and sidebar read from), so subsequent renders show the new rating.
function applyRatingUpdate(id, updated) {
  const patch = {
    human_rating: updated.human_rating,
    machine_rating: updated.machine_rating,
    effective_rating: updated.effective_rating,
    grade: updated.grade,
  };
  for (const cached of Object.values(thingCache)) {
    if (cached.id === id) Object.assign(cached, patch);
    for (const r of cached.related || []) {
      if (r.thing.id === id) Object.assign(r.thing, patch);
    }
  }
}

function renderGradeBadge(thing) {
  const g = thing.grade;
  if (!g) return "";
  return `<span class="g g${g}">${g}</span>`;
}

/* === HOME PAGE === */
async function renderHome(prefillUrl = "") {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <h2>Search / Add</h2>
      <label>
        <input type="checkbox" id="batchToggle" onchange="toggleBatchMode(this.checked)">
        Batch Mode
      </label>
      <br/><br/>
      <div id="searchContainer">
        <input type="text" id="searchInput" placeholder="Paste playlist or video URL"
               value="${escapeAttr(prefillUrl)}"/>
      </div>
      <br/>
      <button onclick="handleSearch()">Go</button>
    </div>

    <div class="card">
      <h2>Bookmarklet</h2>
      <p>Drag to your bookmarks bar:</p>
      <a id="bookmarkletLink" href="#">📌 Add to LinkMeddle</a>
    </div>

    <div class="card">
      <h2>Needs Rating</h2>
      <div id="needsRating">Loading...</div>
    </div>

    <div class="card">
      <h2>In Progress</h2>
      <div id="inProgress">Loading...</div>
    </div>

    <div class="card">
      <h2>Recent Activity</h2>
      <div id="recentActivity">Loading...</div>
    </div>
  `;

  const baseURL = window.location.origin + window.location.pathname;
  document.getElementById("bookmarkletLink").href =
    "javascript:(function(){var t='" + baseURL + "';var c=encodeURIComponent(window.location.href);window.location.href=t+'#/prefill/'+c;})();";

  loadNeedsRating();
  loadInProgress();
  loadRecentActivity();
}

async function loadNeedsRating() {
  const el = document.getElementById("needsRating");
  try {
    const all = await apiGet("/things/?needs_rating=true");
    const data = all.slice(0, 10);   // /things/ has no limit param; bound the panel client-side
    if (!data.length) { el.innerHTML = "<div class='muted'>All things rated</div>"; return; }
    el.innerHTML = data.map(t => `
      <div class="item-row" onclick="location.hash='#/thing/${t.id}'">
        <span class="title">${escapeHtml(t.title || "Untitled")}</span>
        ${renderTypeBadge(t)}
        <span class="muted">${escapeHtml(t.channel || "")}</span>
      </div>
    `).join("");
  } catch { el.innerHTML = "<div class='muted'>Error loading</div>"; }
}

async function loadInProgress() {
  const el = document.getElementById("inProgress");
  try {
    const data = await apiGet("/runs/?in_progress=true");
    if (!data.length) { el.innerHTML = "<div class='muted'>No active jobs</div>"; return; }
    el.innerHTML = data.map(renderRunRow).join("");
  } catch { el.innerHTML = "<div class='muted'>Error loading</div>"; }
}

async function loadRecentActivity() {
  const el = document.getElementById("recentActivity");
  try {
    const data = await apiGet("/runs/?limit=20");
    if (!data.length) { el.innerHTML = "<div class='muted'>No recent activity</div>"; return; }
    el.innerHTML = data.map(renderRunRow).join("");
  } catch { el.innerHTML = "<div class='muted'>Error loading</div>"; }
}

function renderRunRow(r) {
  const statusBadge = r.success === null
    ? `<span class="badge badge-run">Running</span>`
    : r.success
    ? `<span class="badge badge-ok">OK</span>`
    : `<span class="badge badge-fail">Failed</span>`;
  const time = r.starttime ? fmtDt(r.starttime) : "";
  return `
    <div class="item-row" onclick="location.hash='#/thing/${r.thing_id}'">
      <span class="title">${escapeHtml(r.thing_title || "Untitled")}</span>
      ${renderTypeBadgeFromContainer(r.container)}${statusBadge}
      <span class="muted">${time}</span>
    </div>
  `;
}

async function handleSingleURL(url) {
  try {
    const result = await apiGet(`/url?u=${encodeURIComponent(url)}`);
    location.hash = `#/thing/${result.id}`;
  } catch (err) {
    // 404 = not yet known; try adding it
    try {
      const result = await apiPost("/things/", { url });
      if (result.id) {
        location.hash = `#/thing/${result.id}`;
      } else {
        goHome();
      }
    } catch {
      alert("Failed to add URL.");
    }
  }
}

async function handleBatch(urls) {
  const app = document.getElementById("app");
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<h3>Batch Progress</h3>`;
  app.prepend(div);

  let success = 0, failed = 0;
  for (const url of urls) {
    const row = document.createElement("div");
    row.textContent = `Adding: ${url}`;
    div.appendChild(row);
    try {
      await apiPost("/things/", { url });
      row.textContent = `✅ Added: ${url}`;
      success++;
    } catch {
      row.textContent = `❌ Failed: ${url}`;
      failed++;
    }
  }
  const summary = document.createElement("div");
  summary.innerHTML = `<br/><b>Done.</b> Success: ${success} / Failed: ${failed}`;
  div.appendChild(summary);
}

async function handleSearch() {
  const input = document.getElementById("searchInput").value.trim();
  if (!input) return;
  const batchEnabled = document.getElementById("batchToggle")?.checked;
  if (!batchEnabled) {
    await handleSingleURL(input);
  } else {
    const urls = input.split("\n").map(u => u.trim()).filter(Boolean);
    await handleBatch(urls);
  }
}

function toggleBatchMode(enabled) {
  const c = document.getElementById("searchContainer");
  if (enabled) {
    c.innerHTML = `<textarea id="searchInput" rows="6" style="width:100%;"
                             placeholder="Enter one URL per line"></textarea>`;
  } else {
    c.innerHTML = `<input type="text" id="searchInput"
                          placeholder="Paste playlist or video URL"/>`;
  }
}

/* === THING PAGE === */
async function renderThingPage(thingId, ctxId) {
  // In-place update: same container context, already have a video player
  if (
    ctxId &&
    activeContainerData &&
    activeContainerData.id === ctxId &&
    document.getElementById("videoArea") &&
    document.getElementById("currentThingInfo")
  ) {
    await updateVideoInPlace(thingId);
    return;
  }

  const page = await getThingCached(thingId);
  currentVideoId = thingId;
  activeContainerId = ctxId || null;

  if (ctxId) {
    activeContainerData = await getThingCached(ctxId);
    activePlaylistVideos = childVideoIds(activeContainerData);
  } else {
    activeContainerData = null;
    activePlaylistVideos = [];
  }

  const isVideo = page.container === false;
  const isContainer = page.container === true;
  const children = (page.related || []).filter(r => r.direction === "child");
  const parents = (page.related || []).filter(r => r.direction === "parent");
  const indirectChildren = page.indirect_children || [];

  // page.download_url arrives inline from GET /things/{id} (the single-thing endpoint
  // resolves the requested thing's OI URL). No separate /playback call for the current video.

  document.getElementById("app").innerHTML = `
    <div class="row">
      <div class="main">

        ${isVideo ? `<div class="card" id="videoArea">${renderVideoHTML(page)}</div>` : ""}

        <div class="card" id="currentThingInfo">
          ${renderThingInfoHTML(page, isContainer)}
        </div>

        ${isContainer ? renderChildrenCard(children, page.id) : ""}
        ${isContainer && indirectChildren.length ? renderIndirectChildrenCard(indirectChildren) : ""}
        ${isVideo && parents.length ? renderParentsCard(parents) : ""}

      </div>
      ${renderSidebarHTML(thingId)}
    </div>
  `;

  registerVideoPlayer();
  if (isVideo) prefetchUpcomingPlayback(thingId);
}

function childVideoIds(containerPage) {
  return (containerPage.related || [])
    .filter(r => r.direction === "child" && r.thing.container === false)
    .map(r => r.thing.id);
}

function renderVideoHTML(page) {
  if (page.file_available && page.download_url) {
    return `<video id="videoPlayer" controls src="${escapeAttr(page.download_url)}"></video>`;
  }
  return `<div class="placeholder">File not downloaded yet</div>`;
}

function renderThingInfoHTML(thing, isContainer) {
  const isFailing = isThingFailing(thing);
  const statusLines = [];
  if (thing.try_on) statusLines.push(`Next run: ${thing.try_on}`);
  if (thing.last_success_dt) statusLines.push(`Last success: ${fmtDt(thing.last_success_dt)}`);
  if (thing.last_failure_dt) {
    const s = `Last failure: ${fmtDt(thing.last_failure_dt)}`;
    statusLines.push(isFailing ? `<span class="failing-badge">${s}</span>` : s);
  }

  return `
    <h2>${escapeHtml(thing.title || "Untitled")}</h2>
    <div class="muted">
      ${renderTypeBadge(thing)}
      ${thing.channel ? `Channel: ${escapeHtml(thing.channel)}<br/>` : ""}
      ${thing.url ? `URL: ${isHttpUrl(thing.url) ? `<a href="${escapeAttr(thing.url)}" target="_blank">${escapeHtml(thing.url)}</a>` : escapeHtml(thing.url)}<br/>` : ""}
      Library: ${thing.lpm_lib ? escapeHtml(thing.lpm_lib) : "—"}<br/>
      ${statusLines.length ? statusLines.join("<br/>") : ""}
    </div>
    ${renderRatingWidget(thing)}
    <div style="margin-top:8px;">
      ${thing.try_on ? `<button onclick="rescheduleToday('${thing.id}')">Run Today</button>` : ""}
      ${isFailing ? `<button onclick="permafailAck('${thing.id}')">Permafail Ack</button>` : ""}
      <button onclick="setLpmLib('${thing.id}')">Edit Library</button>
    </div>
  `;
}

function renderChildrenCard(children, containerId) {
  if (!children.length) {
    return `<div class="card"><div class="muted">No items yet</div></div>`;
  }
  const rows = children.map(r => {
    const t = r.thing;
    const ctx = t.container !== true ? `?ctx=${containerId}` : "";
    return `
      <div class="item-row" onclick="location.hash='#/thing/${t.id}${ctx}'">
        <span class="title">${escapeHtml(t.title || "Untitled")}</span>
        ${renderTypeBadge(t)}
        ${renderGradeBadge(t)}
        ${!t.file_available && t.container === false ? `<span class="muted">(no file)</span>` : ""}
      </div>
    `;
  }).join("");
  return `<div class="card"><h3>Contents (${children.length})</h3>${rows}</div>`;
}

function renderIndirectChildrenCard(items) {
  const rows = items.map(ic => {
    const t = ic.thing;
    return `
      <div class="item-row" onclick="location.hash='#/thing/${t.id}?ctx=${ic.container_id}'">
        <span class="title">${escapeHtml(t.title || "Untitled")}</span>
        <span class="muted">${escapeHtml(ic.container_title || "")}</span>
        ${renderTypeBadge(t)}
        ${renderGradeBadge(t)}
        ${!t.file_available ? `<span class="muted">(no file)</span>` : ""}
      </div>
    `;
  }).join("");
  return `<div class="card"><h3>Videos (${items.length})</h3>${rows}</div>`;
}

function renderParentsCard(parents) {
  const rows = parents.map(r => {
    const t = r.thing;
    return `
      <div class="item-row" onclick="location.hash='#/thing/${t.id}'">
        <span class="title">${escapeHtml(t.title || "Untitled")}</span>
        ${renderTypeBadge(t)}
        ${r.channel ? `<span class="badge badge-ch">channel</span>` : ""}
      </div>
    `;
  }).join("");
  return `<div class="card"><h3>In Playlists</h3>${rows}</div>`;
}

function sidebarVideoChildren() {
  return (activeContainerData?.related || [])
    .filter(r => r.direction === "child" && r.thing.container === false);
}

function sidebarRowsHTML(activeId) {
  return sidebarVideoChildren().map(r => {
    const t = r.thing;
    const isActive = t.id === activeId;
    return `
      <div class="item-row ${isActive ? "active" : ""}"
           onclick="location.hash='#/thing/${t.id}?ctx=${activeContainerData.id}'">
        <span class="title">${escapeHtml(t.title || "Untitled")}</span>
        ${renderGradeBadge(t)}
        ${!t.file_available ? `<span class="muted">(no file)</span>` : ""}
      </div>
    `;
  }).join("");
}

function renderSidebarHTML(activeId) {
  if (!activeContainerData) return "";
  if (!sidebarVideoChildren().length) return "";
  return `
    <div class="card sidebar">
      <h3>${escapeHtml(activeContainerData.title || "Playlist")}</h3>
      <div id="playlistSidebar">${sidebarRowsHTML(activeId)}</div>
    </div>
  `;
}

async function updateVideoInPlace(newVideoId) {
  // We already hold this child's metadata in the active container's `related` list, so render
  // from that cached summary instead of re-fetching the full page; only the OI URL is fetched,
  // via the dedicated /playback endpoint (usually a prefetch cache hit). Fall back to a full
  // page fetch only if the child isn't found in the container.
  const rel = (activeContainerData?.related || []).find(r => r.thing.id === newVideoId);
  const page = rel ? { ...rel.thing } : await getThingCached(newVideoId);
  currentVideoId = newVideoId;

  if (page.file_available) page.download_url = await getPlaybackCached(newVideoId);

  const videoArea = document.getElementById("videoArea");
  if (videoArea) videoArea.innerHTML = renderVideoHTML(page);

  const infoEl = document.getElementById("currentThingInfo");
  if (infoEl) infoEl.innerHTML = renderThingInfoHTML(page, false);

  // Update sidebar highlight
  const sidebar = document.getElementById("playlistSidebar");
  if (sidebar) {
    sidebar.querySelectorAll(".item-row").forEach(el => el.classList.remove("active"));
    const idx = activePlaylistVideos.indexOf(newVideoId);
    if (idx !== -1) {
      const rows = sidebar.querySelectorAll(".item-row");
      if (rows[idx]) rows[idx].classList.add("active");
    }
  }

  registerVideoPlayer();
  prefetchUpcomingPlayback(newVideoId);
  // In-place transitions are deliberate navigations (autoplay-next via onended, or a sidebar
  // click) — start playback. Best-effort: a browser may block play() without a user gesture.
  currentVideoElement?.play().catch(() => {});
}

function registerVideoPlayer() {
  currentVideoElement = document.getElementById("videoPlayer");
  if (currentVideoElement && activePlaylistVideos.length) {
    currentVideoElement.onended = () => {
      if (autoPlayEnabled) navigatePlaylist(1);
    };
  }
}

async function rescheduleToday(id) {
  const today = new Date().toISOString().split("T")[0];
  try {
    await apiPatch(`/things/${id}`, { try_on: today });
    invalidateCache(id);
    router();
  } catch { alert("Failed to reschedule."); }
}

async function permafailAck(id) {
  // Explicitly send try_on: null so the BFF includes it in exclude_unset payload
  try {
    await apiPatch(`/things/${id}`, { try_on: null });
    invalidateCache(id);
    router();
  } catch { alert("Failed to acknowledge."); }
}

async function setLpmLib(id) {
  // Re-read the current value from cache rather than passing free text through the inline
  // onclick (IDs are safe to interpolate; user-entered tags are not).
  const page = await getThingCached(id);
  const v = prompt("LPM library tag (blank to clear):", page.lpm_lib || "");
  if (v === null) return;                          // cancelled
  const value = v.trim() === "" ? null : v.trim(); // blank clears (PATCH lpm_lib: null)
  try {
    await apiPatch(`/things/${id}`, { lpm_lib: value });
    invalidateCache(id);
    router();
  } catch { alert("Failed to set library."); }
}

/* === NAVIGATION === */
// True iff `id` is a child of the active container that has a downloaded file.
// Sequential navigation (arrows + autoplay) jumps over videos we don't have (#184).
function hasFile(id) {
  const rel = (activeContainerData?.related || []).find(r => r.thing.id === id);
  return !!rel?.thing.file_available;
}

function navigatePlaylist(direction) {
  if (!activePlaylistVideos.length || !currentVideoId) return;
  const idx = activePlaylistVideos.indexOf(currentVideoId);
  if (idx === -1) return;
  // Step in `direction` past videos we don't have a file for, stopping at the
  // first one we do (or running off the end, where we stop as before).
  for (let next = idx + direction; next >= 0 && next < activePlaylistVideos.length; next += direction) {
    if (hasFile(activePlaylistVideos[next])) {
      location.hash = `#/thing/${activePlaylistVideos[next]}?ctx=${activeContainerId}`;
      return;
    }
  }
}

/* === KEYBOARD SHORTCUTS === */
document.addEventListener("keydown", (e) => {
  if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) && e.key !== "?") return;
  const video = currentVideoElement;

  switch (e.key.toLowerCase()) {
    case " ":
    case "k":
      if (video) { e.preventDefault(); video.paused ? video.play() : video.pause(); }
      break;
    case "j":
      if (video) video.currentTime = Math.max(0, video.currentTime - 10);
      break;
    case "l":
      if (video) video.currentTime = Math.min(video.duration, video.currentTime + 10);
      break;
    case "arrowleft":  navigatePlaylist(-1); break;
    case "arrowright": navigatePlaylist(1);  break;
    case "f":
      if (video) {
        document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen();
      }
      break;
    case "m":
      if (video) video.muted = !video.muted;
      break;
    case "home": goHome(); break;
    case "?":    toggleHelpOverlay(); break;
  }
});

/* === HELP OVERLAY === */
function renderHelpOverlay() {
  if (document.getElementById("shortcutOverlay")) return;
  const overlay = document.createElement("div");
  overlay.id = "shortcutOverlay";
  Object.assign(overlay.style, {
    position: "fixed", top: "0", left: "0", width: "100%", height: "100%",
    background: "rgba(0,0,0,0.85)", color: "white", display: "none",
    zIndex: "9999", padding: "40px", overflow: "auto", boxSizing: "border-box"
  });
  overlay.innerHTML = `
    <h2>Keyboard Shortcuts</h2>
    <table style="width:100%;max-width:600px;border-spacing:8px;">
      <tr><td>Space / K</td><td>Play / Pause</td></tr>
      <tr><td>J</td><td>Back 10 seconds</td></tr>
      <tr><td>L</td><td>Forward 10 seconds</td></tr>
      <tr><td>← →</td><td>Previous / Next video</td></tr>
      <tr><td>F</td><td>Fullscreen</td></tr>
      <tr><td>M</td><td>Mute</td></tr>
      <tr><td>Home</td><td>Go to homepage</td></tr>
      <tr><td>?</td><td>Toggle this help</td></tr>
    </table>
    <br/>
    <label>
      <input type="checkbox" id="autoPlayToggle" ${autoPlayEnabled ? "checked" : ""}/>
      Auto-play next video
    </label>
    <br/><br/>
    <button onclick="toggleHelpOverlay()">Close</button>
  `;
  document.body.appendChild(overlay);
  document.getElementById("autoPlayToggle").addEventListener("change", e => {
    autoPlayEnabled = e.target.checked;
  });
}

function toggleHelpOverlay() {
  const overlay = document.getElementById("shortcutOverlay");
  if (!overlay) return;
  helpOverlayVisible = !helpOverlayVisible;
  overlay.style.display = helpOverlayVisible ? "block" : "none";
}

/* === UTILITIES === */
function renderTypeBadge(thing) {
  return renderTypeBadgeFromContainer(thing.container, thing.kind);
}

function renderTypeBadgeFromContainer(container, kind) {
  if (container === true) {
    if (kind === "channel") return `<span class="badge badge-ch">CH</span>`;
    return `<span class="badge badge-pl">PL</span>`;
  }
  if (container === false) return `<span class="badge badge-v">V</span>`;
  return "";
}

function isThingFailing(thing) {
  if (!thing.last_failure_dt) return false;
  if (!thing.last_success_dt) return true;
  return new Date(thing.last_failure_dt) > new Date(thing.last_success_dt);
}

// The backend serializes naive UTC datetimes with no zone suffix (e.g.
// "2026-06-25T03:15:57.891485"); new Date() would parse those as *local*. Append
// "Z" when no zone is present so they're anchored to UTC before display.
function parseUtc(s) {
  if (!s) return null;
  const hasZone = /[zZ]$|[+-]\d{2}:?\d{2}$/.test(String(s));
  return new Date(hasZone ? s : s + "Z");
}

function fmtDt(dt) {
  if (!dt) return "";
  return parseUtc(dt).toLocaleString(undefined, { hour12: false });
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escapeAttr(str) {
  if (str == null) return "";
  return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function isHttpUrl(str) {
  return /^https?:\/\//i.test(String(str || ""));
}
</script>
