<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Video Playlist GUI</title>
  <style>
    body { font-family: Arial; margin: 0; background:#f5f5f5; }
    header { background:#111; color:white; padding:10px 20px; }
    header h1 { margin:0; cursor:pointer; }
    .container { padding:20px; }
    .card { background:white; padding:15px; margin-bottom:15px; border-radius:6px; }
    .row { display:flex; gap:20px; }
    .sidebar { width:300px; }
    .main { flex:1; }
    .video-row { padding:8px 0; border-bottom:1px solid #eee; cursor:pointer; }
    .video-row:hover { background:#fafafa; }
    button { padding:6px 12px; cursor:pointer; }
    input { padding:6px; width:300px; }
    .muted { color:#777; font-size:12px; }
    .placeholder { opacity:0.5; }
    .active { font-weight:bold; }
    video { width:100%; max-height:500px; background:black; }
  </style>
</head>
<body>

<header>
  <h1 onclick="goHome()">Video GUI</h1>
</header>

<div id="app" class="container"></div>

<script>
/* =========================
   CONFIG
========================= */
const API_BASE = "";

/* =========================
   STATE
========================= */

let currentVideoElement = null;
let activePlaylistVideos = [];
let activePlaylistId = null;
let currentVideoId = null;
let autoPlayEnabled = true;
let helpOverlayVisible = false;
let playlistCache = {};
let currentPlaylistData = null;
let videoDataCache = {};

/* =========================
   ROUTER
========================= */

window.addEventListener("hashchange", router);
window.addEventListener("load", router);
renderHelpOverlay();  // is this the right place for this?

function router() {
  const hash = location.hash || "#/";
  const app = document.getElementById("app");

    // Prefill route
  if (hash.startsWith("#/prefill/")) {
    const encoded = hash.replace("#/prefill/", "");
    const decoded = decodeURIComponent(encoded);
    renderHome(decoded);
    return;
  }

  if (hash.startsWith("#/playlist/")) {
    const id = hash.split("/")[2];
    renderPlaylistPage(id);
  } 
  else if (hash.startsWith("#/video/")) {
    const parts = hash.split("/");
    const fileId = parts[2].split("?")[0];
    const params = new URLSearchParams(location.hash.split("?")[1]);
    const playlistId = params.get("playlist");
    renderVideoPage(fileId, playlistId);
  } 
  else {
    renderHome();
  }
}

function goHome() {
  location.hash = "#/";
}

/* =========================
   API HELPERS
========================= */

async function apiGet(path) {
  const res = await fetch(API_BASE + path);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return res.json();
}

async function getPlaylistCached(id) {
  if (!id) return null;

  if (playlistCache[id]) {
    return playlistCache[id];
  }

  const playlist = await apiGet(`/playlists/${id}`);
  playlistCache[id] = playlist;
  return playlist;
}

async function getVideoCached(id) {
  if (videoDataCache[id]) {
    return videoDataCache[id];
  }

  const video = await apiGet(`/videos/${id}`);
  videoDataCache[id] = video;
  return video;
}

async function schedulePlaylist(url) {
  try {
    const result = await apiPost("/playlists/", { url });

    alert("Scheduled successfully.");

    if (playlistCache[result.lm_id]) {
      delete playlistCache[result.lm_id];
    }

    if (result.lm_id) {
      location.hash = `#/playlist/${result.lm_id}`;
    } else {
      goHome();
    }

  } catch (err) {
    alert("Failed to schedule playlist.");
  }
}

/* =========================
   HOME PAGE
========================= */

async function renderHome(prefillUrl = "") {
  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="card">
      <h2>Search / Add Playlist</h2>

      <label>
        <input type="checkbox" id="batchToggle"
              onchange="toggleBatchMode(this.checked)">
        Batch Mode
      </label>

      <br/><br/>

      <div id="searchContainer">
        <input id="searchInput"
              placeholder="Paste playlist or video URL"
              value="${prefillUrl || ""}"/>
      </div>

      <br/>
      <button onclick="handleSearch()">Go</button>
    </div>

    <div class="card">
      <h2>Bookmarklet</h2>
      <p>Drag this to your bookmarks bar:</p>
      <a id="bookmarkletLink" href="#">📌 Schedule in Video App</a>
    </div>

    <div class="card">
      <h2>Current Jobs</h2>
      <div id="currentJobs">Loading...</div>
    </div>

    <!--<div class="card">
      <h2>All Playlists</h2>
      <div id="playlistList">Loading...</div>
    </div>-->
  `;

  loadCurrentJobs();
  //loadPlaylists();

  // Generate bookmarklet code
  const baseURL = window.location.origin + window.location.pathname;

  const bookmarkletCode = `
  javascript:(function(){
    var target='${baseURL}';
    var current=encodeURIComponent(window.location.href);
    window.location.href = target + '#/prefill/' + current;
  })();
  `;

  document.getElementById("bookmarkletLink").href =
    bookmarkletCode.replace(/\n/g,'');

}

async function handleSingleURL(url) {
  try {
    const result = await apiGet(`/url?url=${encodeURIComponent(url)}`);

    if (result.lm_id) {
      location.hash = `#/playlist/${result.lm_id}`;
      return;
    }

    if (result.oi_obj_uuid) {
      location.hash = `#/video/${result.oi_obj_uuid}`;
      return;
    }

    await schedulePlaylist(url);

  } catch {
    await schedulePlaylist(url);
  }
}

async function handleBatch(urls) {

  const app = document.getElementById("app");

  const resultsDiv = document.createElement("div");
  resultsDiv.className = "card";
  resultsDiv.innerHTML = `<h3>Batch Scheduling Progress</h3>`;
  app.prepend(resultsDiv);

  let success = 0;
  let failed = 0;

  for (const url of urls) {

    const row = document.createElement("div");
    row.textContent = `Scheduling: ${url}`;
    resultsDiv.appendChild(row);

    try {
      await apiPost("/playlists/", { url });
      row.textContent = `✅ Scheduled: ${url}`;
      success++;
    } catch {
      row.textContent = `❌ Failed: ${url}`;
      failed++;
    }
  }

  const summary = document.createElement("div");
  summary.innerHTML = `
    <br/>
    <b>Done.</b><br/>
    Success: ${success}<br/>
    Failed: ${failed}
  `;
  resultsDiv.appendChild(summary);

  loadPlaylists(); // refresh list
}

async function handleSearch() {
  const input = document.getElementById("searchInput").value.trim();
  if (!input) return;

  const batchEnabled =
    document.getElementById("batchToggle")?.checked;

  if (!batchEnabled) {
    await handleSingleURL(input);
  } else {
    const urls = input
      .split("\n")
      .map(u => u.trim())
      .filter(Boolean);

    await handleBatch(urls);
  }
}

async function loadCurrentJobs() {
  const data = await apiGet("/playlists/?current=true");
  const container = document.getElementById("currentJobs");

  if (!data.length) {
    container.innerHTML = "<div class='muted'>No active jobs</div>";
    return;
  }

  container.innerHTML = data.map(p => `
    <div onclick="location.hash='#/playlist/${p.lm_id}'" class="video-row">
      <b>${p.title || "Untitled"}</b><br/>
      <span class="muted">URL: ${p.url}</span>
    </div>
  `).join("");
}

async function loadPlaylists() {
  const data = await apiGet("/playlists/");
  const container = document.getElementById("playlistList");

  container.innerHTML = data.map(p => `
    <div class="video-row" onclick="location.hash='#/playlist/${p.lm_id}'">
      ${p.title || "Untitled"} 
      <span class="muted">(${p.channel || "Unknown"})</span>
    </div>
  `).join("");
}

/* =========================
   PLAYLIST PAGE
========================= */

async function renderPlaylistPage(id) {
  const app = document.getElementById("app");
  const playlist = await getPlaylistCached(id);

  app.innerHTML = `
    <div class="card">
      <h2>${playlist.title || "Untitled Playlist"}</h2>
      <div class="muted">
        Channel: ${playlist.channel || "Unknown"}<br/>
        Total Videos: ${playlist.total_videos}<br/>
        Last Run: ${playlist.last_run || "N/A"}<br/>
        Next Run: ${playlist.next_run || "N/A"}<br/>
        URL: <a href="${playlist.url}" target="_blank">${playlist.url}</a>
      </div>
        <button onclick="schedulePlaylist('${playlist.url}')">
          Schedule Today
        </button>
    </div>

    <div class="card">
      <h3>Videos</h3>
      <div>
        ${playlist.videos.map(v => `
          <div class="video-row"
               onclick="location.hash='#/video/${v.oi_file_uuid}?playlist=${playlist.lm_id}'">
            ${v.title || "Untitled"}
            <span class="muted">
              ${v.channel || ""} 
              ${v.file_available ? "" : "(Not Downloaded)"}
            </span><br />
            <span class="muted">URL: ${v.url}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

/* =========================
   VIDEO PAGE
========================= */

async function renderVideoPage(fileId, playlistId) {

  // If already on video page and same playlist → update in place
  if (
    currentPlaylistData &&
    playlistId &&
    currentPlaylistData.lm_id == playlistId &&
    document.getElementById("videoPlayer")
  ) {
    await updateVideoInPlace(fileId);
    return;
  }

  // Otherwise full render
  const app = document.getElementById("app");

  const video = await getVideoCached(fileId);

  currentVideoId = fileId;
  activePlaylistId = playlistId || null;

  if (playlistId) {
    currentPlaylistData = await getPlaylistCached(playlistId);
    activePlaylistVideos = currentPlaylistData.videos.map(v => v.oi_file_uuid);
  } else {
    currentPlaylistData = null;
    activePlaylistVideos = [];
  }

  app.innerHTML = `
    <div class="row">
      <div class="main">

        <div class="card">
          ${video.file_available
            ? `<video id="videoPlayer" controls src="${video.object_url}"></video>`
            : `<div class="placeholder">File not downloaded yet</div>`
          }
        </div>

        <div class="card">
          <h2 id="videoTitle">${video.title || "Untitled Video"}</h2>
          <div class="muted" id="videoChannel">
            Channel: ${video.channel || "Unknown"}
          </div>
        </div>

        <div class="card placeholder">
          <h3>⭐ Rating (Coming Soon)</h3>
          ☆ ☆ ☆ ☆ ☆
        </div>

        <div class="card">
          <h3>Related Playlists</h3>
          <div id="relatedPlaylists">
            ${video.playlists.map(p => `
              <div class="video-row"
                   onclick="location.hash='#/playlist/${p.lm_id}'">
                ${p.title || "Untitled"}
              </div>
            `).join("")}
          </div>
        </div>

      </div>

      ${renderSidebarHTML(fileId)}
    </div>
  `;

  registerVideoPlayer();
}

function renderSidebarHTML(activeId) {
  if (!currentPlaylistData) return "";

  return `
    <div class="card sidebar">
      <h3>Active Playlist</h3>
      <div id="playlistSidebar">
        ${currentPlaylistData.videos.map(v => `
          <div class="video-row ${v.oi_file_uuid === activeId ? "active" : ""}"
               onclick="location.hash='#/video/${v.oi_file_uuid}?playlist=${currentPlaylistData.lm_id}'">
            ${v.title || "Untitled"}
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

async function updateVideoInPlace(newVideoId) {

  const video = await getVideoCached(newVideoId);

  currentVideoId = newVideoId;

  const videoEl = document.getElementById("videoPlayer");
  const titleEl = document.getElementById("videoTitle");
  const channelEl = document.getElementById("videoChannel");

  if (videoEl && video.file_available) {
    videoEl.src = video.object_url;
    videoEl.load();
    videoEl.play();
  }

  if (titleEl) titleEl.textContent = video.title || "Untitled Video";
  if (channelEl) channelEl.textContent = "Channel: " + (video.channel || "Unknown");

  // Update active highlight
  const sidebar = document.getElementById("playlistSidebar");
  if (sidebar) {
    Array.from(sidebar.children).forEach(el => {
      el.classList.remove("active");
    });

    const activeIndex = activePlaylistVideos.indexOf(newVideoId);
    if (activeIndex !== -1) {
      sidebar.children[activeIndex].classList.add("active");
    }
  }

  registerVideoPlayer();
}

function registerVideoPlayer() {
  currentVideoElement = document.getElementById("videoPlayer");

  if (currentVideoElement && activePlaylistVideos.length) {
    currentVideoElement.onended = () => {
      console.log("Video ended");
      if (autoPlayEnabled) {
        navigatePlaylist(1);
      }
    };
  }
} 

/* =========================
   KEYBOARD SHORTCUTS & HELP OVERLAY
========================= */


document.addEventListener("keydown", (e) => {
  // Don't trigger shortcuts when typing in input fields
  if (
    ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) &&
    e.key !== "?"
  ) return;
  const video = currentVideoElement;
 
  console.log("Key pressed:", e.key);

  switch (e.key.toLowerCase()) {

    // Play / Pause
    case " ":
    case "k":
      if (video) {
        e.preventDefault();
        video.paused ? video.play() : video.pause();
      }
      break;

    // Back 10 seconds
    case "j":
      if (video) {
        video.currentTime = Math.max(0, video.currentTime - 10);
      }
      break;

    // Forward 10 seconds
    case "l":
      if (video) {
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
      }
      break;

    // Previous video
    case "arrowleft":
      navigatePlaylist(-1);
      break;

    // Next video
    case "arrowright":
      navigatePlaylist(1);
      break;

    // Fullscreen
    case "f":
      if (video) {
        if (!document.fullscreenElement) {
          video.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
      break;

    // Mute
    case "m":
      if (video) {
        video.muted = !video.muted;
      }
      break;

    // Go Home
    case "home":
      goHome();
      break;
    
    case "?":
      toggleHelpOverlay();
      break;
  }
});

function navigatePlaylist(direction) {

  console.log("Navigating playlist, direction:", direction, currentVideoId);

  if (!activePlaylistVideos.length || !currentVideoId) return;

  const index = activePlaylistVideos.indexOf(currentVideoId);
  if (index === -1) return;

  const nextIndex = index + direction;

  if (nextIndex >= 0 && nextIndex < activePlaylistVideos.length) {
    const nextVideoId = activePlaylistVideos[nextIndex];
    location.hash = `#/video/${nextVideoId}?playlist=${activePlaylistId}`;
  }
}

function renderHelpOverlay() {
  if (document.getElementById("shortcutOverlay")) return;

  const overlay = document.createElement("div");
  overlay.id = "shortcutOverlay";
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background = "rgba(0,0,0,0.85)";
  overlay.style.color = "white";
  overlay.style.display = "none";
  overlay.style.zIndex = "9999";
  overlay.style.padding = "40px";
  overlay.style.overflow = "auto";

  overlay.innerHTML = `
    <h2>Keyboard Shortcuts</h2>
    <table style="width:100%; max-width:600px;">
      <tr><td>Space / K</td><td>Play / Pause</td></tr>
      <tr><td>J</td><td>Back 10 seconds</td></tr>
      <tr><td>L</td><td>Forward 10 seconds</td></tr>
      <tr><td>←</td><td>Previous video</td></tr>
      <tr><td>→</td><td>Next video</td></tr>
      <tr><td>F</td><td>Fullscreen</td></tr>
      <tr><td>M</td><td>Mute</td></tr>
      <tr><td>Home</td><td>Go to homepage</td></tr>
      <tr><td>?</td><td>Toggle this help</td></tr>
    </table>

    <br/>

    <label>
      <input type="checkbox" id="autoPlayToggle" ${autoPlayEnabled ? "checked" : ""}/>
      Auto-play next video
    </label>

    <br/><br/>
    <button onclick="toggleHelpOverlay()">Close</button>
  `;

  document.body.appendChild(overlay);

  document.getElementById("autoPlayToggle").addEventListener("change", (e) => {
    autoPlayEnabled = e.target.checked;
  });
}

function toggleHelpOverlay() {
  const overlay = document.getElementById("shortcutOverlay");
  if (!overlay) return;

  helpOverlayVisible = !helpOverlayVisible;
  overlay.style.display = helpOverlayVisible ? "block" : "none";
}

function toggleBatchMode(enabled) {
  const container = document.getElementById("searchContainer");

  if (enabled) {
    container.innerHTML = `
      <textarea id="searchInput"
                rows="6"
                style="width:100%;"
                placeholder="Enter one URL per line"></textarea>
    `;
  } else {
    container.innerHTML = `
      <input id="searchInput"
             placeholder="Paste playlist or video URL"/>
    `;
  }
}

</script>

</body>
</html>
